<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS COMPANY | البحث عن موظف</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="search-page">

    <main class="container">
        <div id="errorBanner" class="alert-banner alert-error"></div>
        <div id="successBanner" class="alert-banner alert-success"></div>

        <section class="card">
            <h2 class="card-title">البحث عن موظف</h2>

            <div class="form-group">
                <label for="searchId">أدخل الرقم القومي للموظف (14 رقم)</label>
                <input type="text" id="searchId" maxlength="14" placeholder="مثال: 29800000000000">
            </div>

            <div id="loading">
                <div class="spinner"></div>
                جاري البحث... يرجى الانتظار
            </div>

            <button type="button" class="btn-action btn-search" onclick="searchRecord()">🔍 بحث الآن</button>
            <a href="index.html" class="btn-action btn-back">⬅ العودة للقائمة الرئيسية</a>

            <div id="result"></div>
        </section>

        <footer class="footer">
            <strong>GPS COMPANY</strong>
            <p>© 2026 جميع الحقوق محفوظة</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
