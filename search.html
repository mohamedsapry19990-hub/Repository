<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث عن موظف | GPS COMPANY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="search-page">

    <main class="container">
        <section class="card">
            <h2 class="title">البحث عن موظف</h2>

            <div id="errorBanner" style="display:none;"></div>
            <div id="loading">جاري البحث... يرجى الانتظار</div>

            <div class="form-group">
                <label for="searchId">أدخل الرقم القومي للموظف (14 رقم)</label>
                <input type="text" id="searchId" maxlength="14" placeholder="مثال: 29800000000000">
            </div>

            <button type="button" class="btn btn-primary" onclick="searchRecord()">بحث الآن</button>
            <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">العودة للقائمة الرئيسية</button>

            <div id="result"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
