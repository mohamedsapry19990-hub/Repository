<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم تصريح شركة أخرى | GPS COMPANY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="permit-page">

    <main class="container">
        <section class="card">
            <h2 class="title">تقديم تصريح شركة أخرى</h2>

            <div id="errorBanner" style="display:none;"></div>
            <div id="loading">جاري تقديم البيانات... يرجى الانتظار</div>

            <form id="permitForm" onsubmit="event.preventDefault(); savePermit('تقديم ومعايا تصريح شركة ثانية');">
                <div class="form-group">
                    <label for="name">الاسم بالكامل *</label>
                    <input type="text" id="name" placeholder="أدخل الاسم الرباعي" required>
                </div>

                <div class="form-group">
                    <label for="nationalId">الرقم القومي (14 رقم) *</label>
                    <input type="text" id="nationalId" maxlength="14" placeholder="أدخل 14 رقم" required>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف *</label>
                    <input type="text" id="phone" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="job">المهنة *</label>
                    <select id="job" required>
                        <option value="">اختر المهنة...</option>
                        <option value="فني">فني</option>
                        <option value="عامل">عامل</option>
                        <option value="سائق">سائق</option>
                        <option value="مهندس">مهندس</option>
                        <option value="مشرف شدة">مشرف شدة</option>
                        <option value="مشرف لحام">مشرف لحام</option>
                        <option value="مشرف عام">مشرف عام</option>
                        <option value="مشرف إنشائي">مشرف إنشائي</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>

                <div class="form-group" id="cvContainer">
                    <label for="cvInput">ملف / صورة السيرة الذاتية (CV) * للمشرفين</label>
                    <input type="file" id="cvInput" accept="image/*,.pdf" onchange="previewCv()">
                    <img id="cvPreview" class="preview-image" style="display:none;" alt="معاينة الـ CV">
                </div>

                <div class="form-group">
                    <label for="company">اسم الشركة الحالية / السابقة</label>
                    <input type="text" id="company" placeholder="أدخل اسم الشركة">
                </div>

                <div class="form-group">
                    <label for="front">صورة وجه البطاقة *</label>
                    <input type="file" id="front" accept="image/*" onchange="previewFront()" required>
                    <img id="frontPreview" class="preview-image" style="display:none;" alt="وجه البطاقة">
                </div>

                <div class="form-group">
                    <label for="back">صورة ظهر البطاقة *</label>
                    <input type="file" id="back" accept="image/*" onchange="previewBack()" required>
                    <img id="backPreview" class="preview-image" style="display:none;" alt="ظهر البطاقة">
                </div>

                <div class="form-group">
                    <label for="permit">صورة التصريح *</label>
                    <input type="file" id="permit" accept="image/*" onchange="previewPermit()" required>
                    <img id="permitPreview" class="preview-image" style="display:none;" alt="صورة التصريح">
                </div>

                <div class="form-group">
                    <label for="clearance">صورة خطابات الممانعة *</label>
                    <input type="file" id="clearance" accept="image/*" onchange="previewClearance()" required>
                    <img id="clearancePreview" class="preview-image" style="display:none;" alt="صورة الممانعة">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-success">تقديم طلب التصريح</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">العودة للقائمة الرئيسية</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
