<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS COMPANY | تقديم تصريح شركة أخرى</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="permit-page">

    <main class="container">
        <div id="errorBanner" class="alert-banner alert-error"></div>
        <div id="successBanner" class="alert-banner alert-success"></div>

        <section class="card">
            <h2 class="card-title">تقديم تصريح شركة أخرى</h2>

            <form onsubmit="submitFormData(event, 'تقديم ومعايا تصريح شركة ثانية')">
                <div class="form-group">
                    <label for="name">الاسم بالكامل *</label>
                    <input type="text" id="name" placeholder="أدخل الاسم الرباعي" required>
                </div>

                <div class="form-group">
                    <label for="nationalId">الرقم القومي (14 رقم) *</label>
                    <input type="text" id="nationalId" maxlength="14" placeholder="أدخل 14 رقم" required>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف *</label>
                    <input type="text" id="phone" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="job">المهنة *</label>
                    <select id="job" onchange="checkSupervisor('job', 'cvContainer')" required>
                        <option value="">اختر المهنة...</option>
                        <option value="فني">فني</option>
                        <option value="عامل">عامل</option>
                        <option value="سائق">سائق</option>
                        <option value="مهندس">مهندس</option>
                        <option value="مشرف شدة">مشرف شدة</option>
                        <option value="مشرف لحام">مشرف لحام</option>
                        <option value="مشرف عام">مشرف عام</option>
                        <option value="مشرف إنشائي">مشرف إنشائي</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>

                <div class="form-group" id="cvContainer" style="display: none;">
                    <label for="cvInput">ملف / صورة السيرة الذاتية (CV) * للمشرفين</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="cvInput" accept="image/*,.pdf" onchange="previewImage(this, 'cvPreview')">
                        <div class="file-upload-btn">📄 اختر ملف الـ CV</div>
                    </div>
                    <img id="cvPreview" class="preview-img" alt="معاينة CV">
                </div>

                <div class="form-group">
                    <label for="company">اسم الشركة الحالية / السابقة</label>
                    <input type="text" id="company" placeholder="أدخل اسم الشركة">
                </div>

                <div class="form-group image-upload-grid">
                    <div>
                        <label for="front">وجه البطاقة *</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="front" accept="image/*" onchange="previewImage(this, 'frontPreview')" required>
                            <div class="file-upload-btn">📷 الوجه الأمامي</div>
                        </div>
                        <img id="frontPreview" class="preview-img" alt="وجه البطاقة">
                    </div>

                    <div>
                        <label for="back">ظهر البطاقة *</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="back" accept="image/*" onchange="previewImage(this, 'backPreview')" required>
                            <div class="file-upload-btn">📷 الوجه الخلفي</div>
                        </div>
                        <img id="backPreview" class="preview-img" alt="ظهر البطاقة">
                    </div>
                </div>

                <div class="form-group image-upload-grid">
                    <div>
                        <label for="permit">صورة التصريح *</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="permit" accept="image/*" onchange="previewImage(this, 'permitPreview')" required>
                            <div class="file-upload-btn">📑 صورة التصريح</div>
                        </div>
                        <img id="permitPreview" class="preview-img" alt="التصريح">
                    </div>

                    <div>
                        <label for="clearance">صورة خطابات الممانعة *</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="clearance" accept="image/*" onchange="previewImage(this, 'clearancePreview')" required>
                            <div class="file-upload-btn">✔ صورة الممانعة</div>
                        </div>
                        <img id="clearancePreview" class="preview-img" alt="الممانعة">
                    </div>
                </div>

                <div id="loading">
                    <div class="spinner"></div>
                    جاري تقديم طلب التصريح... يرجى الانتظار
                </div>

                <button type="submit" class="btn-action btn-submit">📩 تقديم طلب التصريح</button>
                <a href="index.html" class="btn-action btn-back">⬅ العودة للقائمة الرئيسية</a>
            </form>
        </section>

        <footer class="footer">
            <strong>GPS COMPANY</strong>
            <p>© 2026 جميع الحقوق محفوظة</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
