<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<title>تقديم ومعايا تصريح شركة ثانية</title>

<!-- ربط ملف التنسيقات المشترك -->
<link rel="stylesheet" href="style.css">

<style>
  /* تنسيق شريط التنبيه للأخطاء (أحمر) */
  .alert-banner {
    display: none;
    background-color: #f8d7da;
    color: #842029;
    border: 1px solid #f5c2c7;
    border-radius: 8px;
    padding: 12px 15px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  /* تنسيق شريط التنبيه للنجاح (أخضر) */
  .alert-banner-success {
    display: none;
    background-color: #d1e7dd;
    color: #0f5132;
    border: 1px solid #badbcc;
    border-radius: 8px;
    padding: 12px 15px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  .alert-banner-success h4 {
    margin: 0 0 5px 0;
    font-size: 17px;
    font-weight: bold;
  }

  .alert-banner-success p {
    margin: 0;
    font-size: 13.5px;
  }

  /* حل نهائي لمشاكل الـ Select على الموبايل والكمبيوتر باستخدام قائمة مخصصة */
  .custom-select-wrapper {
      position: relative;
      user-select: none;
      width: 100%;
  }
  .custom-select-trigger {
      height: 52px;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid #007bff;
      background-color: #f8f9fa;
      color: #333;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
  }
  .custom-select-trigger:after {
      content: "▼";
      font-size: 12px;
      color: #007bff;
      transition: transform 0.3s ease;
  }
  .custom-select-wrapper.open .custom-select-trigger:after {
      transform: rotate(180deg);
  }
  .custom-options {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 5px;
      background: #fff;
      border: 2px solid #007bff;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      max-height: 250px;
      overflow-y: auto;
      display: none;
      z-index: 999;
  }
  .custom-select-wrapper.open .custom-options {
      display: block;
  }
  .custom-option {
      padding: 12px 15px;
      font-size: 15px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
      transition: background 0.2s;
  }
  .custom-option:last-child {
      border-bottom: none;
  }
  .custom-option:hover, .custom-option.selected {
      background-color: #e7f1ff;
      color: #0056b3;
  }
</style>
</head>

<body class="permit-page">

<div class="container">
    <div class="card">
        <h2 class="title">
            📄 تقديم ومعايا تصريح شركة ثانية
        </h2>

        <!-- شريط التنبيه للنجاح (أخضر) -->
        <div id="successBanner" class="alert-banner-success">
            <h4>✅ تم حفظ البيانات بنجاح!</h4>
            <p>بيانات حضرتك وصلت بنجاح وإن شاء الله محاضرتك في أقرب وقت.</p>
        </div>

        <!-- شريط التنبيه العلوي للأخطاء -->
        <div id="errorBanner" class="alert-banner"></div>

        <hr>

        <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" id="name" placeholder="أدخل الاسم بالكامل">
        </div>

        <div class="form-group">
            <label>الرقم القومي</label>
            <input type="text" id="nationalId" maxlength="14" placeholder="14 رقم" oninput="this.value = this.value.replace(/\D/g, '')">
        </div>

        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="text" id="phone" placeholder="01xxxxxxxxx">
        </div>

        <!-- قائمة المهن المخصصة الجديدة للموبايل والكمبيوتر -->
        <div class="form-group" style="margin-bottom: 25px;">
            <label style="font-weight: bold; font-size: 16px; margin-bottom: 8px; display: block;">المهنة</label>
            <div class="custom-select-wrapper" id="jobSelectWrapper">
                <div class="custom-select-trigger" id="jobTrigger">-- اختر المهنة من القائمة --</div>
                <input type="hidden" id="job">
                <div class="custom-options">
                    <div class="custom-option" data-value="نجار مسلح">نجار مسلح</div>
                    <div class="custom-option" data-value="حداد مسلح">حداد مسلح</div>
                    <div class="custom-option" data-value="شده معدنيه">شده معدنيه</div>
                    <div class="custom-option" data-value="مساعدين">مساعدين</div>
                    <div class="custom-option" data-value="فرمجي خرسانه">فرمجي خرسانه</div>
                    <div class="custom-option" data-value="بحريه">بحريه</div>
                    <div class="custom-option" data-value="عزل">عزل</div>
                    <div class="custom-option" data-value="كهربائي">كهربائي</div>
                    <div class="custom-option" data-value="حجار">حجار</div>
                    <div class="custom-option" data-value="مساح">مساح</div>
                    <div class="custom-option" data-value="مساعد مساح">مساعد مساح</div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>اسم الشركة القديمه (اللي كنت شغال فيها)</label>
            <input type="text" id="company" placeholder="أدخل اسم الشركة القديمة أو اللي كنت شغال فيها">
        </div>

        <hr>

        <div class="form-group">
            <label>صورة البطاقة (الوجه)</label>
            <input type="file" id="front" accept="image/*" onchange="previewFront()">
            <br><br>
            <img id="frontPreview" class="preview-image" style="display:none;">
        </div>

        <div class="form-group">
            <label>صورة البطاقة (الخلف)</label>
            <input type="file" id="back" accept="image/*" onchange="previewBack()">
            <br><br>
            <img id="backPreview" class="preview-image" style="display:none;">
        </div>

        <div class="form-group">
            <label>صورة التصريح</label>
            <input type="file" id="permit" accept="image/*" onchange="previewPermit()">
            <br><br>
            <img id="permitPreview" class="preview-image" style="display:none;">
        </div>

        <div class="form-group">
            <label style="color:red;">صورة الممانعة ( مهم جدااا بدونها لن يتم القبول)</label>
            <input type="file" id="clearance" accept="image/*" onchange="previewClearance()">
            <br><br>
            <img id="clearancePreview" class="preview-image" style="display:none;">
        </div>

        <hr>

        <button type="button" id="submitBtn" class="btn btn-success" onclick="validateAndSave()">
            💾 حفظ البيانات
        </button>

        <button type="button" class="btn btn-secondary" onclick="goHome()">
            🏠 العودة للرئيسية
        </button>

        <div id="loading" style="display:none; text-align:center; margin-top:20px;">
            ⏳ جاري معالجة وحفظ البيانات...
        </div>
    </div>
</div>

<script>
  // تفعيل القائمة المنسدلة المخصصة للموبايل والكمبيوتر
  const selectWrapper = document.getElementById('jobSelectWrapper');
  const selectTrigger = document.getElementById('jobTrigger');
  const jobInput = document.getElementById('job');
  const optionsList = document.querySelectorAll('.custom-option');

  selectTrigger.addEventListener('click', function (e) {
      e.stopPropagation();
      selectWrapper.classList.toggle('open');
  });

  optionsList.forEach(option => {
      option.addEventListener('click', function () {
          const value = this.getAttribute('data-value');
          const text = this.textContent;
          
          selectTrigger.textContent = text;
          selectTrigger.style.color = '#333';
          jobInput.value = value;
          
          selectWrapper.classList.remove('open');
          
          optionsList.forEach(opt => opt.classList.remove('selected'));
          this.classList.add('selected');
      });
  });

  window.addEventListener('click', function () {
      selectWrapper.classList.remove('open');
  });

  // حجب الرسائل المنبثقة من المتصفح
  window.alert = function() {};

  // معاينة الصور
  function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      const file = input.files[0];
      if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
              preview.src = e.target.result;
              preview.style.display = 'block';
          }
          reader.readAsDataURL(file);
      } else {
          preview.style.display = 'none';
      }
  }

  function previewFront() { previewImage(document.getElementById('front'), 'frontPreview'); }
  function previewBack() { previewImage(document.getElementById('back'), 'backPreview'); }
  function previewPermit() { previewImage(document.getElementById('permit'), 'permitPreview'); }
  function previewClearance() { previewImage(document.getElementById('clearance'), 'clearancePreview'); }

  // إخفاء التنبيهات
  function hideErrorBanner() {
    var banner = document.getElementById('errorBanner');
    var successBanner = document.getElementById('successBanner');
    banner.style.display = 'none';
    banner.innerText = '';
    if (successBanner) successBanner.style.display = 'none';
  }

  // إظهار التنبيه أعلى الصفحة
  function showErrorBanner(message) {
    hideErrorBanner();
    var banner = document.getElementById('errorBanner');
    banner.innerText = '❌ ' + message;
    banner.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // إظهار شريط النجاح الأخضر وتفريغ الحقول
  function showSuccessBanner() {
    hideErrorBanner();
    var banner = document.getElementById('successBanner');
    banner.style.display = 'block';
    resetFormFields();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ضغط وتصغير الصورة قبل تحويلها لـ Base64 لتجنب مشاكل الحجم والبطء
  function fileToBase64Optimized(file) {
      return new Promise((resolve, reject) => {
          if (!file) return resolve("");
          const reader = new FileReader();
          reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                  const canvas = document.createElement('canvas');
                  let width = img.width;
                  let height = img.height;
                  const maxDim = 1000;

                  if (width > maxDim || height > maxDim) {
                      if (width > height) {
                          height = Math.round((height * maxDim) / width);
                          width = maxDim;
                      } else {
                          width = Math.round((width * maxDim) / height);
                          height = maxDim;
                      }
                  }

                  canvas.width = width;
                  canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);
                  resolve(canvas.toDataURL('image/jpeg', 0.70));
              };
              img.onerror = () => resolve(e.target.result);
              img.src = e.target.result;
          };
          reader.onerror = error => reject(error);
          reader.readAsDataURL(file);
      });
  }

  // التحقق قبل الحفظ مع معالجة الصور
  async function validateAndSave() {
    hideErrorBanner();

    var name = document.getElementById('name').value.trim();
    var nationalId = document.getElementById('nationalId').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var job = document.getElementById('job').value;
    var company = document.getElementById('company').value.trim();

    if (!name || !nationalId || !phone || !job || !company) {
      showErrorBanner('الرجاء إتمام إدخال كافة البيانات المطلوبة!');
      return;
    }

    if (nationalId.length !== 14) {
      showErrorBanner('الرقم القومي غير مكتمل! يجب أن يحتوي على 14 رقماً بالضبط.');
      return;
    }

    var clearanceInput = document.getElementById('clearance');
    if (!clearanceInput || clearanceInput.files.length === 0) {
      showErrorBanner('رفع صورة الممانعة إلزامي');
      return;
    }

    var submitBtn = document.getElementById('submitBtn');
    var loading = document.getElementById('loading');

    submitBtn.disabled = true;
    loading.style.display = 'block';

    try {
        const frontFile = document.getElementById('front').files[0];
        const backFile = document.getElementById('back').files[0];
        const permitFile = document.getElementById('permit').files[0];
        const clearanceFile = document.getElementById('clearance').files[0];

        const [frontBase64, backBase64, permitBase64, clearanceBase64] = await Promise.all([
            fileToBase64Optimized(frontFile),
            fileToBase64Optimized(backFile),
            fileToBase64Optimized(permitFile),
            fileToBase64Optimized(clearanceFile)
        ]);

        var formData = {
          action: "saveData",
          type: "تقديم ومعايا تصريح شركة تانية",
          name: name,
          nationalId: nationalId,
          phone: phone,
          job: job,
          company: company,
          frontImage: frontBase64,
          backImage: backBase64,
          permitImage: permitBase64,
          clearanceImage: clearanceBase64
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(handleServerResponse)
              .withFailureHandler(function(err){
                   loading.style.display = 'none';
                   submitBtn.disabled = false;
                   showErrorBanner(err.message || 'حدث خطأ أثناء الحفظ');
              })
              .saveData(formData);
        } else if (typeof saveData === 'function') {
            const res = await saveData(formData);
            handleServerResponse(res);
        } else if (typeof callApi === 'function') {
            const res = await callApi(formData);
            handleServerResponse(res);
        } else {
            loading.style.display = 'none';
            submitBtn.disabled = false;
            showErrorBanner('تعذر الاتصال بالخادم.');
        }

    } catch (err) {
        loading.style.display = 'none';
        submitBtn.disabled = false;
        showErrorBanner('حدث خطأ أثناء معالجة الصور: ' + err.message);
    }
  }

  // الدالة التي تتلقى الرد بعد تنفيذ الحفظ من السيرفر
  function handleServerResponse(res) {
    var loading = document.getElementById('loading');
    var submitBtn = document.getElementById('submitBtn');
    if (loading) loading.style.display = 'none';
    if (submitBtn) submitBtn.disabled = false;

    if (res && (res.status === true || res.status === 'success')) {
      showSuccessBanner();
    } else {
      showErrorBanner(res ? res.message : 'حدث خطأ غير متوقع');
    }
  }

  function showSuccessModal() {
    showSuccessBanner();
  }

  function resetFormFields() {
    document.getElementById('name').value = '';
    document.getElementById('nationalId').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('job').value = '';
    selectTrigger.textContent = '-- اختر المهنة من القائمة --';
    selectTrigger.style.color = '#333';
    optionsList.forEach(opt => opt.classList.remove('selected'));
    
    document.getElementById('company').value = '';
    
    document.getElementById('front').value = '';
    document.getElementById('back').value = '';
    document.getElementById('permit').value = '';
    document.getElementById('clearance').value = '';

    document.getElementById('frontPreview').style.display = 'none';
    document.getElementById('backPreview').style.display = 'none';
    document.getElementById('permitPreview').style.display = 'none';
    document.getElementById('clearancePreview').style.display = 'none';
  }

  function goHome() {
    if (typeof scriptUrl !== 'undefined') {
      window.top.location.href = scriptUrl + '?page=index';
    } else {
      window.top.location.href = 'index.html';
    }
  }
</script>

</body>

</html>
