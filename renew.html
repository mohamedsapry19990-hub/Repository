<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجديد التصاريح</title>

    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* تنسيق شريط التنبيه للأخطاء (أحمر) */
        .alert-banner {
            display: none;
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.4s ease-in-out;
        }

        /* تنسيق شريط التنبيه للنجاح (أخضر) */
        .alert-banner-success {
            display: none;
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: fadeIn 0.4s ease-in-out;
        }

        .alert-banner-success h4 {
            margin: 0 0 5px 0;
            font-size: 17px;
            font-weight: bold;
        }

        .alert-banner-success p {
            margin: 0;
            font-size: 13.5px;
        }

        /* تنسيق القوائم المنسدلة المخصصة */
        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
        }
        .custom-select-trigger {
            height: 52px;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #17a2b8;
            background-color: #f8f9fa;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(23, 162, 184, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .custom-select-trigger:after {
            content: "▼";
            font-size: 12px;
            color: #17a2b8;
            transition: transform 0.3s ease;
        }
        .custom-select-wrapper.open .custom-select-trigger:after {
            transform: rotate(180deg);
        }
        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 5px;
            background: #fff;
            border: 2px solid #17a2b8;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 999;
        }
        .custom-select-wrapper.open .custom-options {
            display: block;
        }
        .custom-option {
            padding: 12px 15px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            border-bottom: 1px solid #f1f1f1;
            transition: background 0.2s;
        }
        .custom-option:last-child {
            border-bottom: none;
        }
        .custom-option:hover, .custom-option.selected {
            background-color: #e0f7fa;
            color: #117a8b;
        }
        .preview-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
            object-fit: contain;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="renew-page">

<div class="container">
    <div class="card">
        <h2 class="title" style="color: #117a8b;">
            🔄 تجديد التصاريح
        </h2>

        <!-- شريط التنبيه للنجاح (أخضر) -->
        <div id="successBanner" class="alert-banner-success">
            <h4>✅ تم تقديم طلب التجديد بنجاح!</h4>
            <p>تم استلام طلب تجديد التصريح بنجاح، وسيتم إتمامه في أقرب وقت.</p>
        </div>

        <!-- شريط التنبيه العلوي للأخطاء -->
        <div id="errorBanner" class="alert-banner"></div>

        <hr>

        <form id="renewForm">
            <div class="form-group">
                <label>الاسم بالكامل</label>
                <input type="text" id="name" class="form-control" placeholder="أدخل الاسم بالكامل" required>
            </div>

            <div class="form-group">
                <label>الرقم القومي</label>
                <input type="text" id="nationalId" class="form-control" maxlength="14" placeholder="14 رقم" required oninput="this.value = this.value.replace(/\D/g, '')">
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" id="phone" class="form-control" placeholder="01xxxxxxxxx" required>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label style="font-weight: bold; font-size: 16px; margin-bottom: 8px; display: block;">المهنة</label>
                <div class="custom-select-wrapper" id="jobSelectWrapper">
                    <div class="custom-select-trigger" id="jobTrigger">-- اختر المهنة من القائمة --</div>
                    <input type="hidden" id="job" required>
                    <div class="custom-options">
                        <div class="custom-option" data-value="نجار مسلح">نجار مسلح</div>
                        <div class="custom-option" data-value="حداد مسلح">حداد مسلح</div>
                        <div class="custom-option" data-value="شده معدنيه">شده معدنيه</div>
                        <div class="custom-option" data-value="مساعدين">مساعدين</div>
                        <div class="custom-option" data-value="فرمجي خرسانه">فرمجي خرسانه</div>
                        <div class="custom-option" data-value="بحريه">بحريه</div>
                        <div class="custom-option" data-value="عزل">عزل</div>
                        <div class="custom-option" data-value="كهربائي">كهربائي</div>
                        <div class="custom-option" data-value="حجار">حجار</div>
                        <div class="custom-option" data-value="مساح">مساح</div>
                        <div class="custom-option" data-value="مساعد مساح">مساعد مساح</div>
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label style="font-weight: bold; font-size: 16px; margin-bottom: 8px; display: block;">اسم الشركة</label>
                <div class="custom-select-wrapper" id="companySelectWrapper">
                    <div class="custom-select-trigger" id="companyTrigger">-- اختر اسم الشركة --</div>
                    <input type="hidden" id="company" required>
                    <div class="custom-options">
                        <div class="custom-option" data-value="GPS">GPS</div>
                    </div>
                </div>
            </div>

            <hr>

            <div class="form-group">
                <label>صورة البطاقة (الوجه)</label>
                <input type="file" id="front" accept="image/*" class="form-control" required onchange="previewImage(this, 'frontPreview')">
                <img id="frontPreview" class="preview-image" style="display:none;">
            </div>

            <div class="form-group">
                <label>صورة البطاقة (الخلف)</label>
                <input type="file" id="back" accept="image/*" class="form-control" required onchange="previewImage(this, 'backPreview')">
                <img id="backPreview" class="preview-image" style="display:none;">
            </div>

            <div class="form-group">
                <label>صورة التصريح (القديم)</label>
                <input type="file" id="permit" accept="image/*" class="form-control" required onchange="previewImage(this, 'permitPreview')">
                <img id="permitPreview" class="preview-image" style="display:none;">
            </div>

            <hr>

            <button type="button" id="submitBtn" class="btn btn-info" style="width: 100%; background-color: #17a2b8; color: white;" onclick="validateAndSave()">
                💾 إرسال طلب التجديد
            </button>

            <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="goHome()">
                🏠 العودة للرئيسية
            </button>
        </form>

        <div id="loading" style="display:none; text-align:center; margin-top:20px; color:#17a2b8; font-weight:bold;">
            ⏳ جاري ضغط الصور وإرسال الطلب...
        </div>
    </div>
</div>

<!-- ربط ملف الجافاسكريبت الخارجي -->
<script src="script.js"></script>

<script>
    // تفعيل القوائم المنسدلة
    const jobWrapper = document.getElementById('jobSelectWrapper');
    const jobTrigger = document.getElementById('jobTrigger');
    const jobInput = document.getElementById('job');
    const jobOptions = jobWrapper.querySelectorAll('.custom-option');

    const companyWrapper = document.getElementById('companySelectWrapper');
    const companyTrigger = document.getElementById('companyTrigger');
    const companyInput = document.getElementById('company');
    const companyOptions = companyWrapper.querySelectorAll('.custom-option');

    jobTrigger.addEventListener('click', function (e) {
        e.stopPropagation();
        companyWrapper.classList.remove('open');
        jobWrapper.classList.toggle('open');
    });

    jobOptions.forEach(option => {
        option.addEventListener('click', function () {
            const value = this.getAttribute('data-value');
            jobTrigger.textContent = this.textContent;
            jobTrigger.style.color = '#333';
            jobInput.value = value;
            jobWrapper.classList.remove('open');
            jobOptions.forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
        });
    });

    companyTrigger.addEventListener('click', function (e) {
        e.stopPropagation();
        jobWrapper.classList.remove('open');
        companyWrapper.classList.toggle('open');
    });

    companyOptions.forEach(option => {
        option.addEventListener('click', function () {
            const value = this.getAttribute('data-value');
            companyTrigger.textContent = this.textContent;
            companyTrigger.style.color = '#333';
            companyInput.value = value;
            companyWrapper.classList.remove('open');
            companyOptions.forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
        });
    });

    window.addEventListener('click', function () {
        jobWrapper.classList.remove('open');
        companyWrapper.classList.remove('open');
    });

    function hideErrorBanner() {
        var banner = document.getElementById('errorBanner');
        var successBanner = document.getElementById('successBanner');
        banner.style.display = 'none';
        banner.innerText = '';
        if (successBanner) successBanner.style.display = 'none';
    }

    function showErrorBanner(message) {
        hideErrorBanner();
        var banner = document.getElementById('errorBanner');
        banner.innerText = '❌ ' + message;
        banner.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showSuccessBanner() {
        hideErrorBanner();
        var banner = document.getElementById('successBanner');
        banner.style.display = 'block';
        resetFormFields();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        } else {
            preview.style.display = 'none';
        }
    }

    // ضغط الصور لحجم خفيف يضمن الرفع السريع وعدم تجاوز سعة Apps Script
    function fileToBase64Optimized(file) {
        return new Promise((resolve, reject) => {
            if (!file) return resolve("");

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 1000;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.70));
                };
                img.onerror = () => resolve(e.target.result);
                img.src = e.target.result;
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function validateAndSave() {
        hideErrorBanner();

        const name = document.getElementById('name').value.trim();
        const nationalId = document.getElementById('nationalId').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const job = document.getElementById('job').value;
        const company = document.getElementById('company').value;

        const frontFile = document.getElementById('front').files[0];
        const backFile = document.getElementById('back').files[0];
        const permitFile = document.getElementById('permit').files[0];

        if (!name || !nationalId || !phone || !job || !company || !frontFile || !backFile || !permitFile) {
            showErrorBanner('الرجاء إدخال جميع البيانات المطلوبة وإرفاق كافة الصور!');
            return;
        }

        if (nationalId.length !== 14) {
            showErrorBanner('الرقم القومي غير مكتمل! يجب أن يحتوي على 14 رقماً بالضبط.');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        submitBtn.disabled = true;
        loading.style.display = 'block';

        try {
            // ضغط الصور الثلاث معاً بشكل متوازي
            const [frontBase64, backBase64, permitBase64] = await Promise.all([
                fileToBase64Optimized(frontFile),
                fileToBase64Optimized(backFile),
                fileToBase64Optimized(permitFile)
            ]);

            const payload = {
                action: "saveData",
                type: "تجديد التصريح",
                name: name,
                nationalId: nationalId,
                phone: phone,
                job: job,
                company: company,
                frontImage: frontBase64,
                backImage: backBase64,
                permitImage: permitBase64
            };

            let apiCallPromise;
            if (typeof callApi === 'function') {
                apiCallPromise = callApi(payload);
            } else if (typeof saveData === 'function') {
                apiCallPromise = saveData(payload);
            } else {
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2dMvVYPBC-C6bJNdLA0bNYqRpA-4scruM6ldlCwxscwqyBNog61e8mDYdyifzftvZVw/exec";
                apiCallPromise = fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                }).then(res => res.json());
            }

            const res = await apiCallPromise;
            loading.style.display = 'none';
            submitBtn.disabled = false;

            if (res && (res.status === true || res.status === "success")) {
                showSuccessBanner();
            } else {
                showErrorBanner(res ? res.message : 'حدث خطأ أثناء إرسال طلب التجديد');
            }

        } catch (err) {
            loading.style.display = 'none';
            submitBtn.disabled = false;
            showErrorBanner("حدث خطأ أثناء الاتصال بالخادم أو معالجة الصور: " + err.message);
        }
    }

    function resetFormFields() {
        document.getElementById('renewForm').reset();
        
        document.getElementById('job').value = '';
        jobTrigger.textContent = '-- اختر المهنة من القائمة --';
        jobTrigger.style.color = '#333';
        jobOptions.forEach(opt => opt.classList.remove('selected'));

        document.getElementById('company').value = '';
        companyTrigger.textContent = '-- اختر اسم الشركة --';
        companyTrigger.style.color = '#333';
        companyOptions.forEach(opt => opt.classList.remove('selected'));

        document.getElementById('frontPreview').style.display = 'none';
        document.getElementById('backPreview').style.display = 'none';
        document.getElementById('permitPreview').style.display = 'none';
    }

    function goHome() {
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
